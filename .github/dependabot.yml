# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci): '
    groups:
      gh-actions-packages:
        patterns:
          - '*'
    cooldown:
      default-days: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps): '
    groups:
      npm-packages:
        patterns:
          - '*'
    cooldown:
      default-days: 2
